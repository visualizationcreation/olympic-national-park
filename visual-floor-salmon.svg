<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>From a reopened route to a lasting population</title><desc>Three ascending stages distinguish fish passage, reproduction and persistence across generations. This is an evidence framework, not a plotted recovery trajectory.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#203f38"/></marker></defs><rect width="1200" height="700" fill="#f0efdf"/><text x="60" y="53" text-anchor="start" font-family="Arial" font-size="15" fill="#203f38">OLYMPIC  /  OPEN INVESTIGATION</text><text x="60" y="109" text-anchor="start" font-family="Georgia" font-size="37" fill="#203f38">From a reopened route to a lasting population</text><text x="60" y="149" text-anchor="start" font-family="Arial" font-size="18" fill="#203f38">Each recovery claim needs evidence matched to its scale.</text><path d="M110 540 Q480 459 1090 518" fill="none" stroke="#78aaa9" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" /><path d="M235 540 L235 430" fill="none" stroke="#76945d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="235" cy="392" r="49" fill="#dce5ce" stroke="#76945d" stroke-width="2"/><g transform="translate(241 392) scale(0.5 0.5)"><path d="M-45 0 Q0 -36 47 0 Q0 36 -45 0 L-73 -24 L-73 24Z" fill="#9da773" stroke="#203f38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="29" cy="-3" r="3" fill="#203f38" stroke="none" stroke-width="2"/></g><text x="235" y="310" text-anchor="middle" font-family="Georgia" font-size="27" fill="#203f38">Passage</text><text x="235" y="591" text-anchor="middle" font-family="Arial" font-size="17" fill="#203f38">Can fish reach habitat?</text><path d="M598 540 L598 355" fill="none" stroke="#76945d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="598" cy="317" r="49" fill="#dce5ce" stroke="#76945d" stroke-width="2"/><g transform="translate(604 317) scale(0.5 0.5)"><path d="M-45 0 Q0 -36 47 0 Q0 36 -45 0 L-73 -24 L-73 24Z" fill="#9da773" stroke="#203f38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="29" cy="-3" r="3" fill="#203f38" stroke="none" stroke-width="2"/></g><text x="598" y="235" text-anchor="middle" font-family="Georgia" font-size="27" fill="#203f38">Reproduction</text><text x="598" y="591" text-anchor="middle" font-family="Arial" font-size="17" fill="#203f38">Are young produced?</text><path d="M972 540 L972 292" fill="none" stroke="#76945d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="972" cy="254" r="49" fill="#dce5ce" stroke="#76945d" stroke-width="2"/><g transform="translate(978 254) scale(0.5 0.5)"><path d="M-45 0 Q0 -36 47 0 Q0 36 -45 0 L-73 -24 L-73 24Z" fill="#9da773" stroke="#203f38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="29" cy="-3" r="3" fill="#203f38" stroke="none" stroke-width="2"/></g><text x="972" y="172" text-anchor="middle" font-family="Georgia" font-size="27" fill="#203f38">Persistence</text><text x="972" y="591" text-anchor="middle" font-family="Arial" font-size="17" fill="#203f38">Across generations?</text><path d="M296 380 L521 329" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M665 306 L895 265" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M60 642 L1140 642" fill="none" stroke="#bcc5b4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="674" text-anchor="start" font-family="Arial" font-size="14" fill="#203f38">ORB JOURNEYS  ·  Conceptual illustration, not measured data or a geographic map</text></svg>