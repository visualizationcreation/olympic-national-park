<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>A logjam changes the choices water can make</title><desc>A bird’s-eye conceptual river bends around a logjam, with a side channel and arrows showing different flow paths. It does not map a specific Quinault restoration project or predict a temperature reduction.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#203f38"/></marker></defs><rect width="1200" height="700" fill="#f0efdf"/><text x="60" y="53" text-anchor="start" font-family="Arial" font-size="15" fill="#203f38">OLYMPIC  /  FIELD ILLUSTRATION</text><text x="60" y="109" text-anchor="start" font-family="Georgia" font-size="37" fill="#203f38">A logjam changes the choices water can make</text><text x="60" y="149" text-anchor="start" font-family="Arial" font-size="18" fill="#203f38">Large wood can redirect flow and help create habitat complexity.</text><path d="M75 305 C285 235 300 544 565 443 S893 213 1130 351 L1130 523 C885 391 822 592 586 554 S326 385 75 459Z" fill="#94bbb0" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M472 476 C580 259 707 244 827 296" fill="none" stroke="#b4cebc" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" /><path d="M443 404 C478 431 486 472 450 501" fill="none" stroke="#487e79" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M392 364 L508 526" fill="none" stroke="#8c7850" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" /><path d="M419 344 L538 497" fill="none" stroke="#8c7850" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" /><path d="M367 462 L561 415" fill="none" stroke="#8c7850" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" /><path d="M438 521 L524 359" fill="none" stroke="#8c7850" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" /><path d="M154 362 Q250 350 310 426" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M606 465 Q735 342 863 367" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M571 383 Q647 292 738 297" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="208" y="239" text-anchor="middle" font-family="Arial" font-size="22" fill="#203f38">Main channel</text><text x="863" y="244" text-anchor="middle" font-family="Arial" font-size="22" fill="#203f38">Side-channel connection</text><text x="769" y="562" text-anchor="middle" font-family="Arial" font-size="22" fill="#203f38">Varied flow and habitat</text><text x="438" y="592" text-anchor="middle" font-family="Arial" font-size="18" fill="#203f38">LARGE WOOD</text><path d="M441 568 L451 525" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M60 642 L1140 642" fill="none" stroke="#bcc5b4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="674" text-anchor="start" font-family="Arial" font-size="14" fill="#203f38">ORB JOURNEYS  ·  Conceptual illustration, not measured data or a geographic map</text></svg>