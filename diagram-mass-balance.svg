<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>An account of glacier gains and losses</title><desc>A snowy winter can still be followed by a negative annual balance.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183f36"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#f2efe3"/><text x="60" y="55" font-family="Segoe UI,Arial" font-size="16" fill="#183f36" text-anchor="start">OLYMPIC · FIELD DIAGRAM</text><text x="60" y="112" font-family="Segoe UI,Arial" font-size="37" fill="#183f36" text-anchor="start">An account of glacier gains and losses</text><text x="60" y="152" font-family="Segoe UI,Arial" font-size="20" fill="#183f36" text-anchor="start">A snowy winter can still be followed by a negative annual balance.</text><path d="M100 535L370 230L665 360L1140 550Z" fill="#c8cbb8" stroke="#183f36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M370 230Q420 250 500 310Q600 365 720 390Q880 440 1000 505L1090 536Q850 520 685 447Q530 355 430 320Z" fill="#b9dbe1" stroke="#183f36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="250" y="212" font-family="Segoe UI,Arial" font-size="25" fill="#183f36" text-anchor="start">Winter accumulation</text><path d="M415 160V240" fill="none" stroke="#183f36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><text x="820" y="350" font-family="Segoe UI,Arial" font-size="25" fill="#183f36" text-anchor="start">Summer loss</text><path d="M835 380L940 468" fill="none" stroke="#183f36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a)"/><path d="M1010 540Q1080 555 1180 595" fill="none" stroke="#8dbec5" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" /><text x="100" y="595" font-family="Segoe UI,Arial" font-size="27" fill="#183f36" text-anchor="start">Net change = gains − losses</text><text x="740" y="620" font-family="Segoe UI,Arial" font-size="21" fill="#183f36" text-anchor="start">Length alone misses thinning</text><path d="M60 654H1220" fill="none" stroke="#b5bfa9" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><text x="60" y="691" font-family="Segoe UI,Arial" font-size="16" fill="#183f36" text-anchor="start">Conceptual illustration · Not measured data, a species identification key or a geographic map</text></svg>