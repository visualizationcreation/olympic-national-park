<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>One life connects several habitats</title><desc>A conceptual loop connects freshwater eggs, juvenile fish, an estuary, ocean growth and returning adults. It is a general life-cycle illustration, not a species-specific schedule.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#203f38"/></marker></defs><rect width="1200" height="700" fill="#f0efdf"/><text x="60" y="53" text-anchor="start" font-family="Arial" font-size="15" fill="#203f38">OLYMPIC  /  FIELD ILLUSTRATION</text><text x="60" y="109" text-anchor="start" font-family="Georgia" font-size="37" fill="#203f38">One life connects several habitats</text><text x="60" y="149" text-anchor="start" font-family="Arial" font-size="18" fill="#203f38">Timing and freshwater needs vary among salmon species and populations.</text><path d="M70 462 C215 340 305 560 415 420 S655 430 739 411 L1110 411 L1110 550 C945 523 843 554 742 490 S591 535 415 510 S212 485 70 555Z" fill="#a5c6bd" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="110" cy="457" r="7" fill="#c0a674" stroke="none" stroke-width="2"/><circle cx="145" cy="457" r="7" fill="#c0a674" stroke="none" stroke-width="2"/><circle cx="180" cy="457" r="7" fill="#c0a674" stroke="none" stroke-width="2"/><g transform="translate(382 444) scale(0.65 0.65)"><path d="M-45 0 Q0 -36 47 0 Q0 36 -45 0 L-73 -24 L-73 24Z" fill="#9da773" stroke="#203f38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="29" cy="-3" r="3" fill="#203f38" stroke="none" stroke-width="2"/></g><g transform="translate(952 463) scale(1.2 1.2)"><path d="M-45 0 Q0 -36 47 0 Q0 36 -45 0 L-73 -24 L-73 24Z" fill="#9da773" stroke="#203f38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="29" cy="-3" r="3" fill="#203f38" stroke="none" stroke-width="2"/></g><g transform="translate(712 287) scale(-0.9 0.9)"><path d="M-45 0 Q0 -36 47 0 Q0 36 -45 0 L-73 -24 L-73 24Z" fill="#9da773" stroke="#203f38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="29" cy="-3" r="3" fill="#203f38" stroke="none" stroke-width="2"/></g><path d="M216 423 Q280 383 315 420" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M450 443 Q580 373 725 432" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M972 381 Q985 228 806 256 L590 286" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M540 277 Q291 198 155 365" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="160" y="590" text-anchor="middle" font-family="Arial" font-size="19" fill="#203f38">Eggs in freshwater</text><text x="410" y="590" text-anchor="middle" font-family="Arial" font-size="19" fill="#203f38">Juvenile habitat</text><text x="697" y="590" text-anchor="middle" font-family="Arial" font-size="19" fill="#203f38">Estuary transition</text><text x="975" y="590" text-anchor="middle" font-family="Arial" font-size="19" fill="#203f38">Ocean growth</text><text x="584" y="215" text-anchor="middle" font-family="Arial" font-size="20" fill="#203f38">Adults return to reproduce</text><path d="M60 642 L1140 642" fill="none" stroke="#bcc5b4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="674" text-anchor="start" font-family="Arial" font-size="14" fill="#203f38">ORB JOURNEYS  ·  Conceptual illustration, not measured data or a geographic map</text></svg>