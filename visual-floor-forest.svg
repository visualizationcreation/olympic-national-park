<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Which process explains a changing forest?</title><desc>Different tree plots appear on opposite mountain slopes, next to a checklist of snow duration, plant timing, seedling survival and disturbance. No observed trend is plotted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#203f38"/></marker></defs><rect width="1200" height="700" fill="#f0efdf"/><text x="60" y="53" text-anchor="start" font-family="Arial" font-size="15" fill="#203f38">OLYMPIC  /  OPEN INVESTIGATION</text><text x="60" y="109" text-anchor="start" font-family="Georgia" font-size="37" fill="#203f38">Which process explains a changing forest?</text><text x="60" y="149" text-anchor="start" font-family="Arial" font-size="18" fill="#203f38">Repeated plots can connect vegetation changes with local conditions.</text><path d="M90 574 L423 286 L748 570Z" fill="#d3d4be" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M423 286 L748 570 H492Z" fill="#b4c2a3" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="172" cy="258" r="42" fill="#d4be80" stroke="none" stroke-width="2"/><g transform="translate(265 458) scale(0.7)"><path d="M0 10 V-85" fill="none" stroke="#786b4d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M-45 -13 L0 -92 L45 -13 Z" fill="#76945d" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-32 -53 L0 -118 L32 -53Z" fill="#557950" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(350 397) scale(0.7)"><path d="M0 10 V-85" fill="none" stroke="#786b4d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M-45 -13 L0 -92 L45 -13 Z" fill="#76945d" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-32 -53 L0 -118 L32 -53Z" fill="#557950" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(473 430) scale(0.7)"><path d="M0 10 V-85" fill="none" stroke="#786b4d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M-45 -13 L0 -92 L45 -13 Z" fill="#76945d" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-32 -53 L0 -118 L32 -53Z" fill="#557950" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(584 526) scale(0.7)"><path d="M0 10 V-85" fill="none" stroke="#786b4d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M-45 -13 L0 -92 L45 -13 Z" fill="#76945d" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-32 -53 L0 -118 L32 -53Z" fill="#557950" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="804" y="239" width="262" height="307" rx="8" fill="#faf8ed" stroke="#a4b39c"/><text x="935" y="278" text-anchor="middle" font-family="Arial" font-size="15" fill="#203f38">REVISIT THE SAME PLOTS</text><rect x="829" y="305" width="16" height="16" rx="8" fill="none" stroke="#76945d"/><text x="863" y="320" text-anchor="start" font-family="Arial" font-size="16" fill="#203f38">Snow duration</text><rect x="829" y="355" width="16" height="16" rx="8" fill="none" stroke="#76945d"/><text x="863" y="370" text-anchor="start" font-family="Arial" font-size="16" fill="#203f38">Plant timing</text><rect x="829" y="405" width="16" height="16" rx="8" fill="none" stroke="#76945d"/><text x="863" y="420" text-anchor="start" font-family="Arial" font-size="16" fill="#203f38">Seedling survival</text><rect x="829" y="455" width="16" height="16" rx="8" fill="none" stroke="#76945d"/><text x="863" y="470" text-anchor="start" font-family="Arial" font-size="16" fill="#203f38">Disturbance history</text><text x="284" y="612" text-anchor="middle" font-family="Arial" font-size="20" fill="#203f38">Contrasting exposure</text><path d="M652 422 H782" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="936" y="603" text-anchor="middle" font-family="Arial" font-size="18" fill="#203f38">Compare explanations over time</text><path d="M60 642 L1140 642" fill="none" stroke="#bcc5b4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="674" text-anchor="start" font-family="Arial" font-size="14" fill="#203f38">ORB JOURNEYS  ·  Conceptual illustration, not measured data or a geographic map</text></svg>