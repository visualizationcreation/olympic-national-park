<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>A stream has more than one water source</title><desc>Three distinct water sources—ice and snow, rain and subsurface water—connect to a stream. Arrows are conceptual and do not show measured quantities.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#203f38"/></marker></defs><rect width="1200" height="700" fill="#f0efdf"/><text x="60" y="53" text-anchor="start" font-family="Arial" font-size="15" fill="#203f38">OLYMPIC  /  OPEN INVESTIGATION</text><text x="60" y="109" text-anchor="start" font-family="Georgia" font-size="37" fill="#203f38">A stream has more than one water source</text><text x="60" y="149" text-anchor="start" font-family="Arial" font-size="18" fill="#203f38">The research question concerns the size and timing of changing contributions.</text><g transform="translate(240 408) scale(1.1)"><path d="M-150 0 L-30 -180 L15 -110 L55 -155 L180 0Z" fill="#b3bcac" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-73 -116 L-30 -180 L15 -110 L-18 -130 L-35 -110Z" fill="#f7f8ef" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M215 239 L296 373 L250 397 L190 337Z" fill="#dce8e4" stroke="#78aaa9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="607" cy="300" r="57" fill="#c9d8d0" stroke="none" stroke-width="2"/><path d="M575 369 L561 407" fill="none" stroke="#78aaa9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M608 369 L594 407" fill="none" stroke="#78aaa9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M641 369 L627 407" fill="none" stroke="#78aaa9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M833 381 Q934 332 1067 378 L1067 437 Q941 396 833 445Z" fill="#c1b38d" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M841 418 Q954 370 1060 410" fill="none" stroke="#78aaa9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M244 432 L419 544" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M605 440 L605 531" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M941 454 L778 544" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M391 574 Q581 541 815 574" fill="none" stroke="#78aaa9" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" /><text x="220" y="205" text-anchor="middle" font-family="Arial" font-size="21" fill="#203f38">Ice + snow storage</text><text x="606" y="206" text-anchor="middle" font-family="Arial" font-size="21" fill="#203f38">Rainfall</text><text x="947" y="299" text-anchor="middle" font-family="Arial" font-size="21" fill="#203f38">Subsurface water</text><text x="606" y="613" text-anchor="middle" font-family="Arial" font-size="22" fill="#203f38">How does each contribution change?</text><path d="M60 642 L1140 642" fill="none" stroke="#bcc5b4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="674" text-anchor="start" font-family="Arial" font-size="14" fill="#203f38">ORB JOURNEYS  ·  Conceptual illustration, not measured data or a geographic map</text></svg>