<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Not seen is not always absent</title><desc>An explicitly hypothetical three-by-three matrix shows detections and nondetections across meadow patches and repeat visits. It contains no real marmot survey data.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#203f38"/></marker></defs><rect width="1200" height="700" fill="#f0efdf"/><text x="60" y="53" text-anchor="start" font-family="Arial" font-size="15" fill="#203f38">OLYMPIC  /  OPEN INVESTIGATION</text><text x="60" y="109" text-anchor="start" font-family="Georgia" font-size="37" fill="#203f38">Not seen is not always absent</text><text x="60" y="149" text-anchor="start" font-family="Arial" font-size="18" fill="#203f38">A hypothetical survey pattern shows why repeat visits matter.</text><text x="245" y="235" text-anchor="middle" font-family="Arial" font-size="20" fill="#203f38">Meadow patch</text><text x="496" y="235" text-anchor="middle" font-family="Arial" font-size="20" fill="#203f38">Visit 1</text><text x="720" y="235" text-anchor="middle" font-family="Arial" font-size="20" fill="#203f38">Visit 2</text><text x="944" y="235" text-anchor="middle" font-family="Arial" font-size="20" fill="#203f38">Visit 3</text><text x="240" y="318" text-anchor="middle" font-family="Arial" font-size="23" fill="#203f38">A</text><path d="M145 349 L1046 349" fill="none" stroke="#c2cabc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="496" cy="310" r="21" fill="#76945d" stroke="#76945d" stroke-width="2"/><circle cx="720" cy="310" r="21" fill="none" stroke="#76945d" stroke-width="2"/><circle cx="944" cy="310" r="21" fill="#76945d" stroke="#76945d" stroke-width="2"/><text x="240" y="408" text-anchor="middle" font-family="Arial" font-size="23" fill="#203f38">B</text><path d="M145 439 L1046 439" fill="none" stroke="#c2cabc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="496" cy="400" r="21" fill="none" stroke="#76945d" stroke-width="2"/><circle cx="720" cy="400" r="21" fill="none" stroke="#76945d" stroke-width="2"/><circle cx="944" cy="400" r="21" fill="none" stroke="#76945d" stroke-width="2"/><text x="240" y="498" text-anchor="middle" font-family="Arial" font-size="23" fill="#203f38">C</text><path d="M145 529 L1046 529" fill="none" stroke="#c2cabc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="496" cy="490" r="21" fill="none" stroke="#76945d" stroke-width="2"/><circle cx="720" cy="490" r="21" fill="#76945d" stroke="#76945d" stroke-width="2"/><circle cx="944" cy="490" r="21" fill="#76945d" stroke="#76945d" stroke-width="2"/><circle cx="289" cy="608" r="8" fill="#76945d" stroke="none" stroke-width="2"/><text x="312" y="614" text-anchor="start" font-family="Arial" font-size="16" fill="#203f38">Detected</text><circle cx="499" cy="608" r="8" fill="none" stroke="#76945d" stroke-width="2"/><text x="522" y="614" text-anchor="start" font-family="Arial" font-size="16" fill="#203f38">Not detected on this visit</text><path d="M60 642 L1140 642" fill="none" stroke="#bcc5b4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="674" text-anchor="start" font-family="Arial" font-size="14" fill="#203f38">ORB JOURNEYS  ·  Conceptual illustration, not measured data or a geographic map</text></svg>