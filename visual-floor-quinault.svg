<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Make the data gap specific</title><desc>A schematic lake cross-section with a fish and sampling line connects to three questions about missing information, decisions and who guides priorities. It is not a bathymetric map of Lake Quinault.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#203f38"/></marker></defs><rect width="1200" height="700" fill="#f0efdf"/><text x="60" y="53" text-anchor="start" font-family="Arial" font-size="15" fill="#203f38">OLYMPIC  /  OPEN INVESTIGATION</text><text x="60" y="109" text-anchor="start" font-family="Georgia" font-size="37" fill="#203f38">Make the data gap specific</text><text x="60" y="149" text-anchor="start" font-family="Arial" font-size="18" fill="#203f38">A useful investigation connects a measurement with a real decision.</text><path d="M85 318 Q291 327 591 318 L587 522 Q270 629 87 496Z" fill="#9abcb3" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M70 304 L120 511 Q310 616 590 522 L630 300" fill="none" stroke="#9e9f79" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(315 410) scale(0.85 0.85)"><path d="M-45 0 Q0 -36 47 0 Q0 36 -45 0 L-73 -24 L-73 24Z" fill="#9da773" stroke="#203f38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="29" cy="-3" r="3" fill="#203f38" stroke="none" stroke-width="2"/></g><path d="M430 328 L430 487" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="430" cy="354" r="6" fill="#f0efdf" stroke="#203f38" stroke-width="2"/><circle cx="430" cy="399" r="6" fill="#f0efdf" stroke="#203f38" stroke-width="2"/><circle cx="430" cy="444" r="6" fill="#f0efdf" stroke="#203f38" stroke-width="2"/><circle cx="430" cy="482" r="6" fill="#f0efdf" stroke="#203f38" stroke-width="2"/><text x="318" y="263" text-anchor="middle" font-family="Arial" font-size="21" fill="#203f38">Lake habitat + water quality</text><path d="M628 412 H744" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="790" y="251" width="309" height="292" rx="8" fill="#e0e6d4" stroke="#aab89c"/><text x="945" y="294" text-anchor="middle" font-family="Arial" font-size="14" fill="#203f38">A DECISION-FOCUSED QUESTION</text><text x="945" y="350" text-anchor="middle" font-family="Arial" font-size="17" fill="#203f38">What information is missing?</text><text x="945" y="412" text-anchor="middle" font-family="Arial" font-size="17" fill="#203f38">Which decision does it affect?</text><text x="945" y="474" text-anchor="middle" font-family="Arial" font-size="17" fill="#203f38">Who guides the priorities?</text><text x="292" y="610" text-anchor="middle" font-family="Arial" font-size="17" fill="#203f38">Schematic lake section</text><text x="944" y="598" text-anchor="middle" font-family="Arial" font-size="19" fill="#203f38">Evidence informs stewardship</text><path d="M60 642 L1140 642" fill="none" stroke="#bcc5b4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="674" text-anchor="start" font-family="Arial" font-size="14" fill="#203f38">ORB JOURNEYS  ·  Conceptual illustration, not measured data or a geographic map</text></svg>