<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Oceanic material becomes mountain terrain</title><desc>A conceptual cross-section shows an oceanic plate descending beneath North America, sediments accumulating at the margin and uplifted terrain above. Not to scale.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#203f38"/></marker></defs><rect width="1200" height="700" fill="#f0efdf"/><text x="60" y="53" text-anchor="start" font-family="Arial" font-size="15" fill="#203f38">OLYMPIC  /  FIELD ILLUSTRATION</text><text x="60" y="109" text-anchor="start" font-family="Georgia" font-size="37" fill="#203f38">Oceanic material becomes mountain terrain</text><text x="60" y="149" text-anchor="start" font-family="Arial" font-size="18" fill="#203f38">Subduction, accretion and uplift are distinct parts of the explanation.</text><path d="M70 410 L480 410 L740 570 L70 570Z" fill="#a3b6ab" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M70 380 L495 380 L790 565 L740 570 L480 410 L70 410Z" fill="#c0a674" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M440 375 L530 330 L570 290 L625 340 L670 278 L710 365 L1130 370 L1130 590 L790 590Z" fill="#c3b99c" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M70 340 Q200 330 330 340 T480 340" fill="none" stroke="#78aaa9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M190 432 L390 432" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M550 440 L695 533" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M594 255 V206" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="215" y="290" text-anchor="middle" font-family="Arial" font-size="22" fill="#203f38">Pacific Ocean</text><text x="285" y="487" text-anchor="middle" font-family="Arial" font-size="19" fill="#203f38">Juan de Fuca plate</text><text x="895" y="456" text-anchor="middle" font-family="Arial" font-size="22" fill="#203f38">North America</text><text x="677" y="203" text-anchor="middle" font-family="Arial" font-size="20" fill="#203f38">Uplift + folding</text><text x="915" y="548" text-anchor="middle" font-family="Arial" font-size="18" fill="#203f38">Material added at the margin</text><path d="M813 527 L635 367" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M60 642 L1140 642" fill="none" stroke="#bcc5b4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="674" text-anchor="start" font-family="Arial" font-size="14" fill="#203f38">ORB JOURNEYS  ·  Conceptual illustration, not measured data or a geographic map</text></svg>