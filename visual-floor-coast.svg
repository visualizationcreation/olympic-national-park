<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Several pressures can leave similar signals</title><desc>A schematic tidepool and sensor are surrounded by temperature, water chemistry, exposure and natural-variability labels. No stressor is assigned a measured effect.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#203f38"/></marker></defs><rect width="1200" height="700" fill="#f0efdf"/><text x="60" y="53" text-anchor="start" font-family="Arial" font-size="15" fill="#203f38">OLYMPIC  /  OPEN INVESTIGATION</text><text x="60" y="109" text-anchor="start" font-family="Georgia" font-size="37" fill="#203f38">Several pressures can leave similar signals</text><text x="60" y="149" text-anchor="start" font-family="Arial" font-size="18" fill="#203f38">The challenge is to distinguish patterns from their causes.</text><path d="M377 462 Q350 343 463 303 Q626 275 758 323 Q859 384 791 486 Q617 572 377 462Z" fill="#b8b99b" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M410 435 Q402 354 503 338 Q641 323 745 361 Q804 402 751 458 Q588 514 410 435Z" fill="#83aea6" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="482" cy="398" r="15" fill="#566c57" stroke="none" stroke-width="2"/><circle cx="547" cy="452" r="15" fill="#566c57" stroke="none" stroke-width="2"/><circle cx="725" cy="406" r="15" fill="#566c57" stroke="none" stroke-width="2"/><path d="M632 340 L632 442" fill="none" stroke="#203f38" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="632" cy="450" r="12" fill="#203f38" stroke="none" stroke-width="2"/><text x="232" y="235" text-anchor="middle" font-family="Arial" font-size="22" fill="#203f38">Temperature</text><text x="957" y="235" text-anchor="middle" font-family="Arial" font-size="22" fill="#203f38">Water chemistry</text><text x="194" y="528" text-anchor="middle" font-family="Arial" font-size="18" fill="#203f38">Exposure + disturbance</text><text x="978" y="528" text-anchor="middle" font-family="Arial" font-size="18" fill="#203f38">Natural variability</text><path d="M324 252 L459 325" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M909 260 L747 332" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M329 518 L432 455" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M902 499 L773 448" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="605" y="604" text-anchor="middle" font-family="Arial" font-size="19" fill="#203f38">Pair biological surveys with environmental records</text><path d="M60 642 L1140 642" fill="none" stroke="#bcc5b4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="674" text-anchor="start" font-family="Arial" font-size="14" fill="#203f38">ORB JOURNEYS  ·  Conceptual illustration, not measured data or a geographic map</text></svg>