<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>Sediment continues beyond the river mouth</title><desc>A river reaches the coast and branches across a fan of deposited sediment. This is a conceptual delta illustration, not an aerial image or measured map of the Elwha.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#203f38"/></marker></defs><rect width="1200" height="700" fill="#f0efdf"/><text x="60" y="53" text-anchor="start" font-family="Arial" font-size="15" fill="#203f38">OLYMPIC  /  FIELD ILLUSTRATION</text><text x="60" y="109" text-anchor="start" font-family="Georgia" font-size="37" fill="#203f38">Sediment continues beyond the river mouth</text><text x="60" y="149" text-anchor="start" font-family="Arial" font-size="18" fill="#203f38">Reconnection can change the shoreline and the seabed.</text><rect x="70" y="210" width="1060" height="395" rx="8" fill="#abc8be" stroke="none"/><path d="M70 210 H780 L712 290 L797 345 L701 410 L767 472 L663 604 H70Z" fill="#c7c9ad" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M75 350 C222 456 447 260 664 403" fill="none" stroke="#527e77" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" /><path d="M620 382 Q751 421 877 484 Q815 585 664 568 Q672 486 620 430Z" fill="#d7c38f" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M631 417 L799 481 M646 438 L738 539 M646 399 L817 427" fill="none" stroke="#78aaa9" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" /><path d="M300 388 Q442 317 588 390" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="264" y="281" text-anchor="middle" font-family="Arial" font-size="22" fill="#203f38">River carries sediment</text><text x="931" y="290" text-anchor="middle" font-family="Arial" font-size="24" fill="#203f38">Nearshore</text><text x="880" y="584" text-anchor="middle" font-family="Arial" font-size="21" fill="#203f38">New deposits reshape habitat</text><path d="M60 642 L1140 642" fill="none" stroke="#bcc5b4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="674" text-anchor="start" font-family="Arial" font-size="14" fill="#203f38">ORB JOURNEYS  ·  Conceptual illustration, not measured data or a geographic map</text></svg>