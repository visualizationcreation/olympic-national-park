<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Keep the instrument’s setting with its record</title><desc>Place, observation period and measurement type are part of the evidence.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183f36"/></marker></defs><rect x="0" y="0" width="1280" height="720" fill="#f2efe3"/><text x="60" y="55" font-family="Segoe UI,Arial" font-size="16" fill="#183f36" text-anchor="start">OLYMPIC · FIELD DIAGRAM</text><text x="60" y="112" font-family="Segoe UI,Arial" font-size="37" fill="#183f36" text-anchor="start">Keep the instrument’s setting with its record</text><text x="60" y="152" font-family="Segoe UI,Arial" font-size="20" fill="#183f36" text-anchor="start">Place, observation period and measurement type are part of the evidence.</text><rect x="70" y="245" width="650" height="300" fill="#8dbec5"/><path d="M720 245L1200 400V590H720Z" fill="#b4b8a4" stroke="#183f36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M880 410Q975 365 1120 455Q980 475 880 410Z" fill="#8dbec5" stroke="#183f36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M335 270V520" fill="none" stroke="#183f36" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="321" y="325" width="28" height="33" fill="#f0ebd9"/><rect x="321" y="430" width="28" height="33" fill="#f0ebd9"/><rect x="321" y="500" width="28" height="33" fill="#f0ebd9"/><rect x="994" y="419" width="28" height="25" fill="#f0ebd9"/><text x="110" y="212" font-family="Segoe UI,Arial" font-size="26" fill="#183f36" text-anchor="start">Offshore mooring</text><text x="853" y="345" font-family="Segoe UI,Arial" font-size="26" fill="#183f36" text-anchor="start">Shore logger</text><text x="115" y="610" font-family="Segoe UI,Arial" font-size="26" fill="#183f36" text-anchor="start">Connected settin