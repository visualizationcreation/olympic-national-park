<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>A mountain barrier divides the weather</title><desc>Moist Pacific air rises on a mountain’s windward side, with rain drawn beneath clouds; drier air descends on the opposite side. Regional pattern, not a weather forecast.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#203f38"/></marker></defs><rect width="1200" height="700" fill="#f0efdf"/><text x="60" y="53" text-anchor="start" font-family="Arial" font-size="15" fill="#203f38">OLYMPIC  /  FIELD ILLUSTRATION</text><text x="60" y="109" text-anchor="start" font-family="Georgia" font-size="37" fill="#203f38">A mountain barrier divides the weather</text><text x="60" y="149" text-anchor="start" font-family="Arial" font-size="18" fill="#203f38">Windward and leeward exposure help create different growing conditions.</text><path d="M60 527 Q210 513 390 527" fill="none" stroke="#78aaa9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(605 560) scale(1.8)"><path d="M-150 0 L-30 -180 L15 -110 L55 -155 L180 0Z" fill="#b3bcac" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-73 -116 L-30 -180 L15 -110 L-18 -130 L-35 -110Z" fill="#f7f8ef" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M100 330 C270 330 355 265 455 220" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M700 213 C820 280 920 330 1080 339" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="380" cy="275" r="39" fill="#c8d6d0" stroke="none" stroke-width="2"/><circle cx="423" cy="247" r="39" fill="#c8d6d0" stroke="none" stroke-width="2"/><circle cx="468" cy="236" r="39" fill="#c8d6d0" stroke="none" stroke-width="2"/><path d="M350 320 L322 399" fill="none" stroke="#78aaa9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M380 320 L352 399" fill="none" stroke="#78aaa9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M410 320 L382 399" fill="none" stroke="#78aaa9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M440 320 L412 399" fill="none" stroke="#78aaa9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M470 320 L442 399" fill="none" stroke="#78aaa9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M500 320 L472 399" fill="none" stroke="#78aaa9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="1005" cy="231" r="42" fill="#d6bf82" stroke="none" stroke-width="2"/><text x="206" y="575" text-anchor="middle" font-family="Arial" font-size="18" fill="#203f38">PACIFIC</text><text x="325" y="444" text-anchor="middle" font-family="Arial" font-size="20" fill="#203f38">Rise · cool · condense</text><text x="938" y="444" text-anchor="middle" font-family="Arial" font-size="20" fill="#203f38">Drier leeward air</text><text x="604" y="613" text-anchor="middle" font-family="Arial" font-size="17" fill="#203f38">OLYMPIC MOUNTAINS</text><path d="M60 642 L1140 642" fill="none" stroke="#bcc5b4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="674" text-anchor="start" font-family="Arial" font-size="14" fill="#203f38">ORB JOURNEYS  ·  Conceptual illustration, not measured data or a geographic map</text></svg>