<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>The ocean’s nutrients travel upstream</title><desc>Returning salmon carry material from an ocean panel toward a stream and trees. A separate lower arrow shows water moving downstream. No proportional nutrient contribution is implied.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#203f38"/></marker></defs><rect width="1200" height="700" fill="#f0efdf"/><text x="60" y="53" text-anchor="start" font-family="Arial" font-size="15" fill="#203f38">OLYMPIC  /  FIELD ILLUSTRATION</text><text x="60" y="109" text-anchor="start" font-family="Georgia" font-size="37" fill="#203f38">The ocean’s nutrients travel upstream</text><text x="60" y="149" text-anchor="start" font-family="Arial" font-size="18" fill="#203f38">Returning fish connect marine production with freshwater food webs.</text><rect x="75" y="236" width="265" height="305" rx="8" fill="#a6c4bd" stroke="none"/><text x="210" y="287" text-anchor="middle" font-family="Arial" font-size="19" fill="#203f38">OCEAN</text><g transform="translate(222 378) scale(1.25 1.25)"><path d="M-45 0 Q0 -36 47 0 Q0 36 -45 0 L-73 -24 L-73 24Z" fill="#9da773" stroke="#203f38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="29" cy="-3" r="3" fill="#203f38" stroke="none" stroke-width="2"/></g><path d="M355 484 Q535 534 689 447 T1125 505" fill="none" stroke="#78aaa9" stroke-width="27" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(874 438) scale(1.8)"><path d="M0 10 V-85" fill="none" stroke="#786b4d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M-45 -13 L0 -92 L45 -13 Z" fill="#76945d" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-32 -53 L0 -118 L32 -53Z" fill="#557950" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(1037 450) scale(1.25)"><path d="M0 10 V-85" fill="none" stroke="#786b4d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M-45 -13 L0 -92 L45 -13 Z" fill="#76945d" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-32 -53 L0 -118 L32 -53Z" fill="#557950" stroke="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(602 418) scale(0.95 0.95)"><path d="M-45 0 Q0 -36 47 0 Q0 36 -45 0 L-73 -24 L-73 24Z" fill="#9da773" stroke="#203f38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="29" cy="-3" r="3" fill="#203f38" stroke="none" stroke-width="2"/></g><path d="M311 331 C430 212 575 254 614 352" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M675 370 C739 300 816 277 866 319" fill="none" stroke="#203f38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M965 520 Q660 611 378 548" fill="none" stroke="#4a7772" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="552" y="232" text-anchor="middle" font-family="Arial" font-size="21" fill="#203f38">Returning salmon</text><text x="885" y="249" text-anchor="middle" font-family="Arial" font-size="21" fill="#203f38">Freshwater food webs</text><text x="655" y="603" text-anchor="middle" font-family="Arial" font-size="19" fill="#203f38">Water continues downstream</text><text x="223" y="595" text-anchor="middle" font-family="Arial" font-size="19" fill="#203f38">Nutrients acquired at sea</text><path d="M60 642 L1140 642" fill="none" stroke="#bcc5b4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="674" text-anchor="start" font-family="Arial" font-size="14" fill="#203f38">ORB JOURNEYS  ·  Conceptual illustration, not 