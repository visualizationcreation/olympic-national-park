<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img"><title>An object is not its whole story</title><desc>A generic woven fragment, a record sheet and a group of people represent material evidence, recorded context and community interpretation. No specific Makah artifact is depicted.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#203f38"/></marker></defs><rect width="1200" height="700" fill="#f0efdf"/><text x="60" y="53" text-anchor="start" font-family="Arial" font-size="15" fill="#203f38">OLYMPIC  /  FIELD ILLUSTRATION</text><text x="60" y="109" text-anchor="start" font-family="Georgia" font-size="37" fill="#203f38">An object is not its whole story</text><text x="60" y="149" text-anchor="start" font-family="Arial" font-size="18" fill="#203f38">Evidence gains meaning through context and the people who interpret it.</text><rect x="100" y="220" width="270" height="300" rx="8" fill="#e3dfc8" stroke="none"/><rect x="465" y="230" width="230" height="280" rx="8" fill="#faf9ef" stroke="#aab4a0"/><rect x="820" y="220" width="280" height="300" rx="8" fill="#dbe4cf" stroke="none"/><path d="M135 270 Q120 355 145 438" fill="none" stroke="#c0a674" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M130 280 Q225 270 330 285" fill="none" stroke="#9f895c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M163 270 Q148 355 173 438" fill="none" stroke="#c0a674" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M130 305 Q225 295 330 310" fill="none" stroke="#9f895c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M191 270 Q176 355 201 438" fill="none" stroke="#c0a674" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M130 330 Q225 320 330 335" fill="none" stroke="#9f895c" stroke-width="8" stroke-